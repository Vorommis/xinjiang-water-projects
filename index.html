<style>

.lock{background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:400px;width:90%;margin:0 auto;position:relative;top:50%;transform:translateY(-50%)}

.lock button{width:100%;padding:12px;background:#2980b9;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:16px;transition:background .3s}
.lock button:hover{background:#1a5276}
.err{color:#e74c3c;font-size:13px;margin-top:12px;display:none}#content{width:100%;overflow-x:auto}</style>

async function sha256(s){var e=new TextEncoder().encode(s);var h=await crypto.subtle.digest("SHA-256",e);return new Uint8Array(h)}
async function check(){
try{
var pw=document.getElementById("pw").value;
var key=await crypto.subtle.importKey("raw",await sha256(pw),{name:"AES-GCM"},false,["decrypt"]);
var raw=Uint8Array.from(atob(ED),function(c){return c.charCodeAt(0)});
var nonce=raw.slice(0,12),ct=raw.slice(12);
var dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
var html=new TextDecoder().decode(dec);
document.getElementById("lock").style.display="none";
var c=document.getElementById("content");c.style.display="block";c.innerHTML=html;
var scripts=c.querySelectorAll("script");scripts.forEach(function(s){var n=document.createElement("script");n.textContent=s.textContent;document.body.appendChild(n)});
}catch(e){document.getElementById("err").style.display="block";document.getElementById("pw").value=""}
}
