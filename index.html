async function sha256(s){var e=new TextEncoder().encode(s);var h=await crypto.subtle.digest("SHA-256",e);return new Uint8Array(h)}
async function check(){
try{
var pw=document.getElementById("pw").value;
var key=await crypto.subtle.importKey("raw",await sha256(pw),{name:"AES-GCM"},false,["decrypt"]);
var raw=Uint8Array.from(atob(ED),function(c){return c.charCodeAt(0)});
var nonce=raw.slice(0,12),ct=raw.slice(12);
var dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
var html=new TextDecoder().decode(dec);
// Blob URL approach - most reliable: creates a real document load
var blob=new Blob([html],{type:"text/html;charset=UTF-8"});
window.location.replace(URL.createObjectURL(blob));
}catch(e){document.getElementById("err").style.display="block";document.getElementById("pw").value=""}
}
</script>
