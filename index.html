<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新疆水利项目统一信息库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f4f8;color:#333}
.hd{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;padding:14px 20px;text-align:center}
.hd h1{font-size:20px}
.hd p{font-size:12px;opacity:.8;margin-top:2px}
.wrap{max-width:100%;padding:8px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sc{background:#fff;border-radius:6px;padding:8px 12px;flex:1;min-width:80px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sc .n{font-size:20px;font-weight:700;color:#1a5276}
.sc .l{font-size:10px;color:#888}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.bar input,.bar select{font-size:12px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;outline:none}
.bar input:focus,.bar select:focus{border-color:#2980b9}
.bar input{flex:1;min-width:140px}
.twrap{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow-x:auto}
table{width:max-content;min-width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
th{background:#2980b9;color:#fff;padding:6px 3px;text-align:center!important;border-bottom:2px solid #1a5276;font-weight:600;cursor:pointer;white-space:nowrap;user-select:none;font-size:10px}
th:hover{background:#1a5276}
td{padding:5px 3px;border-bottom:1px solid #f0f0f0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
tr:hover{background:#f8fafc}
.tag{display:inline-block;padding:1px 5px;border-radius:6px;font-size:9px;font-weight:600}
.tn{background:#d4efdf;color:#1e8449}
.td{background:#fdebd0;color:#b9770e}
.te{background:#d6eaf8;color:#2471a3}
.info{font-size:10px;color:#888;padding:3px 6px}
.ft{text-align:center;padding:12px;font-size:10px;color:#aaa}
.c0{width:38px}
.c1{width:75px}
.c2{width:42px}
.c3{width:66px}
.c4{width:280px}
.c5{width:160px}
.c6{width:65px}
.c7{width:62px}
.c8{width:60px}
.c9{width:68px}
.c10{width:78px}
.c11{width:55px}
.c12{width:80px}
.c13{width:72px}
.c14{width:72px}
.c15{width:90px}
.c16{width:80px}
.c17{width:65px}
.c18{width:70px}
.c19{width:80px}
.c20{width:70px}
.c21{width:80px}
.c22{width:70px}
.c23{width:80px}
.c24{width:70px}
.c25{width:75px}
.c26{width:80px}
.c26{width:72px}
.c27{width:68px}
.c28{width:80px}
.c29{width:70px}
.c30{width:70px}
.c31{width:68px}
.c32{width:80px}
.c33{width:70px}
.c34{width:62px}
.c35{width:80px}
</style>
</head>
<body>
<div class="hd"><h1>新疆水利项目统一信息库</h1><p>14地州+兵团 | 343个项目 | 37列 | 横向拖动查看全部</p></div>
<div class="wrap">
<div class="stats" id="st"></div>
<div class="bar">
<input type="text" id="q" placeholder="搜索..." oninput="f()">
<select id="rg" onchange="f()"><option value="">全部地州</option></select>
<select id="ct" onchange="f()"><option value="">全部分类</option></select>
<select id="tp" onchange="f()"><option value="">全部类型</option></select>
</div>
<div class="info" id="cnt"></div>
<div class="twrap"><table><thead><tr>
<th class="c0" onclick="s('id')">序号</th>
<th class="c1" onclick="s('地州')">地州</th>
<th class="c2" onclick="s('项目类型')">类型</th>
<th class="c3" onclick="s('分类号')">分类</th>
<th class="c4" onclick="s('项目名称')">项目名称</th>
<th class="c5" onclick="s('建设内容及规模')">建设内容</th>
<th class="c6" onclick="s('总投资_万元')">总投资</th>
<th class="c7" onclick="s('资金来源')">资金来源</th>
<th class="c8" onclick="s('计划开工时间')">开工</th>
<th class="c9" onclick="s('建设地点')">建设地点</th>
<th class="c10" onclick="s('项目法人')">项目法人</th>
<th class="c11" onclick="s('项目单位性质')">单位性质</th>
<th class="c12" onclick="s('联系人及联系方式')">联系人</th>
<th class="c13" onclick="s('设计单位')">设计单位</th>
<th class="c14" onclick="s('招标代理')">招标代理</th>
<th class="c15" onclick="s('项目进展情况')">进展情况</th>
<th class="c16" onclick="s('关键关系资源')">关键关系资源</th>
<th class="c17" onclick="s('关系资源级别')">关系级别</th>
<th class="c18" onclick="s('关系资源备注')">关系备注</th>
<th class="c19" onclick="s('业主决策层联系人')">决策层联系人</th>
<th class="c20" onclick="s('业主决策层职务')">决策层职务</th>
<th class="c21" onclick="s('业主参与层联系人')">参与层联系人</th>
<th class="c22" onclick="s('业主参与层职务')">参与层职务</th>
<th class="c23" onclick="s('业主操作层联系人')">操作层联系人</th>
<th class="c24" onclick="s('业主操作层职务')">操作层职务</th>
<th class="c26" onclick="s('公共资源中心联系人')">资源中心联系人</th>
<th class="c26" onclick="s('主要竞争对手')">竞争对手</th>
<th class="c27" onclick="s('评标专家')">评标专家</th>
<th class="c28" onclick="s('投标策略要点')">投标策略</th>
<th class="c29" onclick="s('策划责任人')">策划责任人</th>
<th class="c30" onclick="s('市场经理')">市场经理</th>
<th class="c31" onclick="s('攻关状态')">攻关状态</th>
<th class="c32" onclick="s('下一步行动')">下一步行动</th>
<th class="c33" onclick="s('预计招标时间')">预计招标</th>
<th class="c34" onclick="s('中标概率(%)')">中标概率</th>
<th class="c35" onclick="s('备注')">备注</th>
</tr></thead><tbody id="tb"></tbody></table></div>
</div>
<div class="ft">新疆水利项目信息库</div>

<script type="application/json" id="data">
</script>
<script>
var D=JSON.parse(document.getElementById("data").textContent);
(function(){
var rs={},cs={},ts={};
D.forEach(function(d){rs[d["地州"]]=1;cs[d["分类号"]]=1;ts[d["项目类型"]]=1});
var re=document.getElementById("rg"),ce=document.getElementById("ct"),te=document.getElementById("tp");
Object.keys(rs).sort().forEach(function(k){if(k!=="-"){var o=document.createElement("option");o.value=k;o.textContent=k;re.appendChild(o)}});
Object.keys(cs).sort().forEach(function(k){if(k!=="-"){var o=document.createElement("option");o.value=k;o.textContent=k;ce.appendChild(o)}});
Object.keys(ts).sort().forEach(function(k){if(k&&k!=="-"){var o=document.createElement("option");o.value=k;o.textContent=k;te.appendChild(o)}});
st();f();
})();
function st(){
var t=D.length,n1=0,n2=0,n3=0;
D.forEach(function(d){var c=d["分类号"];if(c==="纯新建")n1++;else if(c==="可研/设计阶段")n2++;else n3++});
var rc={};D.forEach(function(d){rc[d["地州"]]=1});
document.getElementById('st').innerHTML=
'<div class="sc"><div class="n">'+t+'</div><div class="l">总项目</div></div>'+
'<div class="sc"><div class="n">'+n1+'</div><div class="l">纯新建</div></div>'+
'<div class="sc"><div class="n">'+n2+'</div><div class="l">可研/设计</div></div>'+
'<div class="sc"><div class="n">'+n3+'</div><div class="l">初步阶段</div></div>'+
'<div class="sc"><div class="n">'+Object.keys(rc).length+'</div><div class="l">地州/师</div></div>';
}
var sc="id",sd=1;
function s(col){if(sc===col)sd=-sd;else{sc=col;sd=1}f()}
function f(){
var q=(document.getElementById("q").value||"").toLowerCase(),
rg=document.getElementById("rg").value,ct=document.getElementById("ct").value,tp=document.getElementById("tp").value;
var arr=D.filter(function(d){
if(rg&&d["地州"]!==rg)return false;
if(ct&&d["分类号"]!==ct)return false;
if(tp&&d["项目类型"]!==tp)return false;
if(q){var t=(d["项目名称"]+"|"+(d["建设地点"]||"")+"|"+(d["项目法人"]||"")).toLowerCase();if(t.indexOf(q)===-1)return false}
return true;
});
arr.sort(function(a,b){var va=a[sc]||"",vb=b[sc]||"";var na=parseFloat(va),nb=parseFloat(vb);if(!isNaN(na)&&!isNaN(nb))return(na-nb)*sd;return String(va).localeCompare(String(vb))*sd});
var h="";
arr.forEach(function(d,i){
var c=d["分类号"]||"",tag=c==="纯新建"?'<span class="tag tn">纯新建</span>':c==="可研/设计阶段"?'<span class="tag td">可研/设计</span>':'<span class="tag te">初步阶段</span>';
var inv=d["总投资_万元"]||"-";if(inv!=="-"){var n=parseFloat(inv);inv=!isNaN(n)&&n>0?n>=10000?(n/10000).toFixed(1)+"亿":n.toFixed(0)+"万":"-"}
var stt=d["计划开工时间"]||"-";if(stt!=="-")stt=stt.replace(" 00:00:00","");
h+="<tr>"+"<td>"+(i+1)+"</td>"+"<td>"+he(d["地州"])+"</td>"+"<td>"+he(d["项目类型"])+"</td>"+"<td>"+tag+"</td>"+"<td title=\""+he(d["项目名称"]||"-")+"\">"+he(d["项目名称"]||"-")+"</td>"+"<td title=\""+he(d["建设内容及规模"]||"-")+"\">"+he((d["建设内容及规模"]||"-").substring(0,20))+"</td>"+"<td>"+inv+"</td>"+"<td>"+he(d["资金来源"])+"</td>"+"<td>"+he(stt)+"</td>"+"<td>"+he(d["建设地点"])+"</td>"+"<td title=\""+he(d["项目法人"]||"-")+"\">"+he((d["项目法人"]||"-").substring(0,12))+"</td>"+"<td>"+he(d["项目单位性质"])+"</td>"+"<td title=\""+he(d["联系人及联系方式"]||"-")+"\">"+he((d["联系人及联系方式"]||"-").substring(0,12))+"</td>"+"<td>"+he(d["设计单位"])+"</td>"+"<td>"+he(d["招标代理"])+"</td>"+"<td>"+he(d["项目进展情况"])+"</td>"+"<td>"+he(d["关键关系资源"])+"</td>"+"<td>"+he(d["关系资源级别"])+"</td>"+"<td>"+he(d["关系资源备注"])+"</td>"+"<td>"+he(d["业主决策层联系人"])+"</td>"+"<td>"+he(d["业主决策层职务"])+"</td>"+"<td>"+he(d["业主参与层联系人"])+"</td>"+"<td>"+he(d["业主参与层职务"])+"</td>"+"<td>"+he(d["业主操作层联系人"])+"</td>"+"<td>"+he(d["业主操作层职务"])+"</td>"+"<td>"+he(d["公共资源中心联系人"])+"</td>"+"<td>"+he(d["主要竞争对手"])+"</td>"+"<td>"+he(d["评标专家"])+"</td>"+"<td>"+he(d["投标策略要点"])+"</td>"+"<td>"+he(d["策划责任人"])+"</td>"+"<td>"+he(d["市场经理"])+"</td>"+"<td>"+he(d["攻关状态"])+"</td>"+"<td>"+he(d["下一步行动"])+"</td>"+"<td>"+he(d["预计招标时间"])+"</td>"+"<td>"+he(d["中标概率(%)"])+"</td>"+"<td>"+he(d["备注"])+"</td>"+"</tr>";
});
document.getElementById("tb").innerHTML=h;
document.getElementById("cnt").textContent=arr.length+" / "+D.length+" 条";
}
function he(s){s=String(s||"-");return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
</script>
</body>
</html>
